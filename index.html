<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カイジポーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>カイジポーカー<span class="sub">KAIJI POKER</span></h1>

<!-- スタート画面 -->
<div id="start-screen">
  <p>プレイヤー人数を選んでください（あなた＋AI）</p>
  <button class="pc-btn" onclick="startGame(2)"><span>2人（AI 1人）</span></button>
  <button class="pc-btn" onclick="startGame(3)"><span>3人（AI 2人）</span></button>
  <button class="pc-btn" onclick="startGame(4)"><span>4人（AI 3人）</span></button>
  <button class="pc-btn" onclick="startGame(5)"><span>5人（AI 4人）</span></button>
  <div class="pc-divider">── または ──</div>
  <button class="pc-btn pc-btn-online" onclick="showOnlineScreen()"><span>オンライン対戦</span></button>
</div>

<!-- オンライン入室画面 -->
<div id="online-screen">
  <p class="online-lead">名前を入力してください</p>
  <input id="player-name" class="text-input" placeholder="プレイヤー名（最大8文字）" maxlength="8">
  <div class="online-section-title">ルームを作成する</div>
  <button class="pc-btn pc-btn-online" onclick="createRoom()"><span>ルーム作成</span></button>
  <div class="online-section-title">ルームに参加する</div>
  <input id="room-code-input" class="text-input code-input" placeholder="4文字のコード" maxlength="4">
  <button class="pc-btn" onclick="joinRoomByInput()"><span>参加する</span></button>
  <button class="pc-btn-text" onclick="showStartScreen()">← 戻る</button>
</div>

<!-- 待機画面 -->
<div id="wait-screen">
  <p class="online-lead">ルームコード</p>
  <div id="wait-code" class="wait-code-display">----</div>
  <p class="online-lead" style="font-size:.8rem">このコードを相手に教えてください</p>
  <div id="wait-players" class="wait-players"></div>
  <button id="start-btn" class="pc-btn pc-btn-online" onclick="startOnlineGame()" style="display:none"><span>ゲーム開始</span></button>
  <p id="wait-msg" class="wait-msg">他のプレイヤーを待っています...</p>
  <button class="pc-btn-text" onclick="showStartScreen()">← 退室</button>
</div>

<!-- ゲームボード -->
<div id="game-board">
  <div id="top-zone"></div>
  <div id="middle-zone">
    <div id="left-zone"></div>
    <div id="center-zone">
      <div id="msg">ゲームを開始してください</div>
      <div id="turn-info"></div>
      <div id="deck-info"></div>
      <div id="pot-info"></div>
      <div id="bet-log"></div>
    </div>
    <div id="right-zone"></div>
  </div>
  <div id="player-zone">
    <div id="player-area">
      <h3>あなたの手札</h3>
      <div id="player-hand"></div>
      <div id="player-sum"></div>
      <div id="player-chip-log"></div>
    </div>
  </div>
  <div id="action-area"></div>
  <div id="room-ctrl"></div>
</div>
<div id="chip-tooltip"></div>

<!-- トレードモーダル -->
<div id="modal-bg">
  <div id="modal">
    <h2 id="modal-title">カード交換</h2>
    <div id="modal-body"></div>
  </div>
</div>

<!-- ショーダウン -->
<div id="sd-bg">
  <div id="sd"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="game.js"></script>
</body>
</html>
