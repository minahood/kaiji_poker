<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カイジポーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>カイジポーカー<span class="sub">KAIJI POKER</span></h1>

<div id="start-screen">
  <p>プレイヤー人数を選んでください（あなた＋AI）</p>
  <button class="pc-btn" onclick="startGame(2)"><span>2人（AI 1人）</span></button>
  <button class="pc-btn" onclick="startGame(3)"><span>3人（AI 2人）</span></button>
  <button class="pc-btn" onclick="startGame(4)"><span>4人（AI 3人）</span></button>
  <button class="pc-btn" onclick="startGame(5)"><span>5人（AI 4人）</span></button>
</div>

<div id="game-board">
  <div id="top-zone"></div>
  <div id="middle-zone">
    <div id="left-zone"></div>
    <div id="center-zone">
      <div id="msg">ゲームを開始してください</div>
      <div id="turn-info"></div>
      <div id="deck-info"></div>
    </div>
    <div id="right-zone"></div>
  </div>
  <div id="player-zone">
    <div id="player-area">
      <h3>あなたの手札</h3>
      <div id="player-hand"></div>
      <div id="player-sum"></div>
    </div>
  </div>
  <div id="action-area"></div>
</div>

<div id="modal-bg">
  <div id="modal">
    <h2 id="modal-title">カード交換</h2>
    <div id="modal-body"></div>
  </div>
</div>

<div id="sd-bg">
  <div id="sd"></div>
</div>

<script src="game.js"></script>
</body>
</html>
